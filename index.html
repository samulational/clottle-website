<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clottle Inc.</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #ffffff, #ffffff);
        color: rgb(0, 0, 0);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Top header text */
      header {
        text-align: center;
        padding: 20px;
        font-size: 1.2rem;
        font-weight: 500;
        opacity: 0.9;
      }

      /* Center area */
      .center {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: 480px;
        height: 480px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <header>
      Welcome to Clottle Inc.
    </header>

    <div class="center">
      <!-- Replace logo.png with your real logo file -->
      <img src="logo.png" alt="Clottle Logo" class="logo" />
    </div>
  </body>
</html>
